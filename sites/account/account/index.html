<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <title>Your account · VettID</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/account.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="https://vettid.org" aria-label="VettID home (vettid.org)">
      <img class="brand-logo" src="/assets/vettid-horizontal-transparent.svg" alt="" width="752" height="300">
      <img class="brand-icon" src="/assets/favicon.svg" alt="" width="512" height="512">
      <span class="brand-tag">Account</span>
    </a>
    <div class="header-tools">
      <div class="who-text" id="who" hidden>
        <span class="who-name" id="who-name"></span>
        <span class="who-email" id="who-email"></span>
      </div>
      <button type="button" class="theme-btn" id="theme-toggle" hidden></button>
      <button type="button" class="btn btn-sm" id="signout" hidden>Sign out</button>
    </div>
  </header>

  <main id="main" class="wide" tabindex="-1">
    <div id="errors" class="msg-region" role="alert" aria-atomic="true"></div>
    <div id="notices" class="msg-region" role="status" aria-atomic="true"></div>
    <div id="gate" class="card" aria-live="polite">
      <p class="loading" id="gate-msg">Loading your account…</p>
    </div>
    <div id="dash" hidden>
      <div class="page-head">
        <span class="eyebrow">Your account</span>
        <h1 id="hello">Your account</h1>
      </div>
      <div class="tabs" role="tablist" aria-label="Account sections" id="tabs">
        <button type="button" role="tab" class="tab" id="tab-start" aria-controls="panel-start" aria-selected="true"><span class="tab-label" id="tab-start-label">Getting started</span><span class="tab-badge" id="tab-start-badge" aria-hidden="true" hidden></span></button>
        <button type="button" role="tab" class="tab" id="tab-membership" aria-controls="panel-membership" aria-selected="false" tabindex="-1">Membership</button>
        <button type="button" role="tab" class="tab" id="tab-vault" aria-controls="panel-vault" aria-selected="false" tabindex="-1">Vault</button>
        <button type="button" role="tab" class="tab" id="tab-security" aria-controls="panel-security" aria-selected="false" tabindex="-1">Security</button>
        <button type="button" role="tab" class="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1">Settings</button>
      </div>
      <div class="stack tabpanel" role="tabpanel" id="panel-start" aria-labelledby="tab-start">
        <section class="card" id="sec-checklist" aria-labelledby="h-checklist"></section>
        <section class="card" id="sec-status" aria-labelledby="h-status"></section>
        <p class="guide-link"><a href="/guide/">New here? Read the step-by-step guide <span aria-hidden="true">→</span></a></p>
      </div>
      <div class="stack tabpanel" role="tabpanel" id="panel-membership" aria-labelledby="tab-membership" hidden>
        <section class="card" id="sec-terms" aria-labelledby="h-terms"></section>
        <section class="card" id="sec-sub" aria-labelledby="h-sub"></section>
      </div>
      <div class="stack tabpanel" role="tabpanel" id="panel-vault" aria-labelledby="tab-vault" hidden>
        <section class="card" id="sec-vault" aria-labelledby="h-vault"></section>
        <section class="card" id="sec-vault-help" aria-labelledby="h-vault-help" hidden></section>
      </div>
      <div class="stack tabpanel" role="tabpanel" id="panel-security" aria-labelledby="tab-security" hidden>
        <section class="card" id="sec-pin" aria-labelledby="h-pin"></section>
      </div>
      <div class="stack tabpanel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
        <section class="card" id="sec-prefs" aria-labelledby="h-prefs"></section>
        <section class="card danger" id="sec-cancel" aria-labelledby="h-cancel"></section>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <ul>
      <li><a href="https://vettid.org">vettid.org</a></li>
      <li><a href="https://vettid.org/security/">Privacy &amp; security</a></li>
      <li><a href="mailto:support@vettid.org">support@vettid.org</a></li>
    </ul>
  </footer>
</body>
</html>
