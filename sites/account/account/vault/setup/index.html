<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <title>Set up your vault · VettID</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/vault-setup.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="https://vettid.org" aria-label="VettID home (vettid.org)">
      <img class="brand-logo brand-logo-dark" src="/assets/vettid-horizontal-transparent.svg" alt="" width="752" height="300">
      <img class="brand-logo brand-logo-light" src="/assets/vettid-horizontal-transparent-on-light.svg" alt="" width="752" height="300">
      <img class="brand-icon" src="/assets/favicon.svg" alt="" width="512" height="512">
      <span class="brand-tag">Account</span>
    </a>
    <div class="header-tools">
      <button type="button" class="theme-btn" id="theme-toggle" hidden></button>
      <a class="btn btn-sm" href="/account/#vault">Your account</a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <p class="back-link"><a href="/account/#vault"><span aria-hidden="true">←</span> Your vault</a></p>
    <div class="page-head">
      <span class="eyebrow">Vault</span>
      <h1>Set up your vault</h1>
      <p>Get a setup code here, then scan it, or type it, in the VettID app on your phone. The app never asks you to sign in.</p>
    </div>
    <div id="errors" class="msg-region" role="alert" aria-atomic="true"></div>
    <div id="notices" class="msg-region" role="status" aria-atomic="true"></div>
    <div id="setup" class="stack">
      <section class="card"><p class="loading">Loading…</p></section>
    </div>
  </main>
  <footer class="site-footer">
    <ul>
      <li><a href="https://vettid.org">vettid.org</a></li>
      <li><a href="https://vettid.org/security/">Privacy &amp; security</a></li>
      <li><a href="mailto:support@vettid.org">support@vettid.org</a></li>
    </ul>
  </footer>
</body>
</html>
