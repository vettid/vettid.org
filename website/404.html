<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta name="robots" content="noindex"/>
  <title>Page Not Found - VettID</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png"/>
  <link rel="preload" href="/assets/fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/plusjakartasans-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/shared/nav.css">
  <link rel="stylesheet" href="/assets/site.css">
  <style>

    h1 { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    main {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 120px 24px 60px;
    }
    .card {
      max-width: 520px; width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-block;
      background: rgba(255,193,37,0.15);
      color: var(--accent);
      border: 1px solid var(--border-accent);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 12px; }
    .card p { color: var(--text-muted); margin-bottom: 28px; }
    .btn-home {
      display: inline-block;
      background: var(--accent);
      color: #1f1e5c;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      transition: background 200ms;
    }
    .btn-home:hover { background: var(--accent-hover); }

  </style>
</head>
<body>

<!-- Header -->
<header>
  <a href="/" class="header-logo">
    <img src="/assets/logo-192.png" alt="VettID">
    <span>VETTID</span>
  </a>
  <nav class="desktop-nav">
    <a href="/security">Security</a>
    <a href="/donate">Donate</a>
  </nav>
  <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="nav-menu" id="navMenu" style="display:none;position:fixed;top:0;right:0;width:280px;height:100%;background:#2e2d88;padding:80px 20px 40px;z-index:1005;flex-direction:column;gap:8px;">
  <a href="/" style="display:block;color:#c9c8e8;text-decoration:none;padding:12px 16px;font-size:1rem;">Home</a>
  <a href="/donate" style="display:block;color:#c9c8e8;text-decoration:none;padding:12px 16px;font-size:1rem;">Donate</a>
  <a href="/security" style="display:block;color:#c9c8e8;text-decoration:none;padding:12px 16px;font-size:1rem;">Security</a>
</div>
<div class="nav-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(22,21,63,0.78);z-index:1000;"></div>

<main>
  <div class="card">
    <span class="badge">404</span>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/" class="btn-home">Back to Home</a>
  </div>
</main>

<footer>
  <p style="margin-bottom: 8px;"><a href="/">Home</a> &middot; <a href="/security">Security</a> &middot; <a href="/donate">Donate</a> &middot; <a href="https://github.com/vettid" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  <p>&copy; 2026 The VettID Project. All rights reserved.</p>
</footer>

<script src="/shared/js/nav.js"></script>
</body>
</html>
